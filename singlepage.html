<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Details | Paul Mercer Real Estate Listings</title>
  <meta name="description"
    content="View luxury real estate listing details with Paul Mercer and The Mercer Group, Keller Williams Tampa Properties." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23071220'/%3E%3Cstop offset='100%25' stop-color='%23122742'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23f5d77f'/%3E%3Cstop offset='50%25' stop-color='%23d4a738'/%3E%3Cstop offset='100%25' stop-color='%23aa7c1e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23bg)'/%3E%3Crect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='url(%23gold)' stroke-width='1.5' stroke-opacity='0.4'/%3E%3Cpath d='M32 14 L48 27 L48 48 L41 48 L41 33 L32 40 L23 33 L23 48 L16 48 L16 27 Z' fill='url(%23gold)'/%3E%3Ccircle cx='32' cy='24' r='2.5' fill='%23071220'/%3E%3C/svg%3E" />
  <link rel="alternate icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --navy-950: #071220;
      --navy-900: #0b1a2d;
      --navy-800: #122742;
      --navy-700: #1a3556;
      --gold-600: #b58820;
      --gold-500: #d4a738;
      --gold-400: #eac565;
      --gold-100: #fbf5e6;
      --emerald-600: #059669;
      --emerald-500: #10b981;
      --emerald-100: #d1fae5;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white: #ffffff;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 28px -6px rgba(15, 23, 42, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--slate-50);
      color: var(--slate-900);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Hero Header ─── */
    .hero {
      position: relative;
      background: radial-gradient(circle at 80% 20%, rgba(212, 167, 56, 0.18) 0%, transparent 45%),
        linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 50%, var(--navy-800) 100%);
      color: var(--white);
      padding: 40px 24px 44px;
      overflow: hidden;
      border-bottom: 3px solid var(--gold-500);
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(234, 197, 101, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-wrap {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .back-link-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-full);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .back-link-pill:hover {
      background: var(--gold-500);
      border-color: var(--gold-500);
      color: var(--navy-950);
      transform: translateX(-2px);
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(212, 167, 56, 0.14);
      border: 1px solid rgba(234, 197, 101, 0.35);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gold-400);
      backdrop-filter: blur(8px);
    }

    .hero-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #fff;
    }

    .hero-subtitle {
      font-size: 16px;
      font-weight: 500;
      color: var(--slate-300);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-subtitle .dot {
      width: 5px;
      height: 5px;
      background: var(--gold-400);
      border-radius: 50%;
      display: inline-block;
    }

    /* ─── Main Container ─── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* Preview Notice Banner */
    .preview-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* ─── Photo Slider / Carousel ─── */
    .slider-wrap {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
    }

    .slider {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--navy-950);
      aspect-ratio: 16 / 9;
    }

    .track {
      display: flex;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1);
      will-change: transform;
    }

    .track.dragging {
      transition: none;
    }

    .slide {
      flex: 0 0 100%;
      height: 100%;
      position: relative;
      cursor: zoom-in;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      background: rgba(11, 26, 45, 0.75);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      z-index: 5;
    }

    .nav-btn:hover {
      background: var(--gold-500);
      color: var(--navy-950);
      border-color: var(--gold-500);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-btn:disabled {
      opacity: 0;
      pointer-events: none;
    }

    .nav-btn.prev {
      left: 16px;
    }

    .nav-btn.next {
      right: 16px;
    }

    .counter-badge {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(7, 18, 32, 0.85);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .counter-badge svg {
      color: var(--gold-400);
    }

    .expand-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(7, 18, 32, 0.82);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      z-index: 5;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .expand-badge svg {
      color: var(--gold-400);
    }

    .expand-badge:hover {
      background: var(--gold-500);
      color: var(--navy-950);
      border-color: var(--gold-500);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .expand-badge:hover svg {
      color: var(--navy-950);
    }

    /* ─── Full-Screen Photo Lightbox Modal ─── */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      background: rgba(5, 12, 22, 0.97);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .lightbox-modal.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      background: rgba(4, 10, 18, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--white);
      z-index: 10;
    }

    .lightbox-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .lightbox-addr {
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45vw;
    }

    .lightbox-counter-pill {
      background: rgba(212, 167, 56, 0.18);
      border: 1px solid rgba(212, 167, 56, 0.45);
      color: var(--gold-400);
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .lightbox-counter-pill svg {
      color: var(--gold-400);
    }

    .lightbox-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--white);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .lightbox-close-btn:hover {
      background: var(--gold-500);
      color: var(--navy-950);
      border-color: var(--gold-500);
      transform: scale(1.08);
    }

    .lightbox-main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px 16px;
      user-select: none;
      touch-action: pan-y pinch-zoom;
    }

    .lightbox-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65);
      transition: opacity 0.2s ease, transform 0.2s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(11, 26, 45, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .lightbox-nav-btn:hover {
      background: var(--gold-500);
      color: var(--navy-950);
      border-color: var(--gold-500);
      transform: translateY(-50%) scale(1.08);
    }

    .lightbox-nav-btn.prev {
      left: 18px;
    }

    .lightbox-nav-btn.next {
      right: 18px;
    }

    .lightbox-nav-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      pointer-events: none;
    }

    .lightbox-bottom-strip {
      padding: 10px 18px 14px;
      background: rgba(4, 10, 18, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      justify-content: center;
      scrollbar-width: thin;
      z-index: 10;
    }

    .lightbox-thumb {
      width: 62px;
      height: 44px;
      flex: 0 0 62px;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid transparent;
      opacity: 0.55;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
      background: #000;
    }

    .lightbox-thumb.active {
      border-color: var(--gold-400);
      opacity: 1;
      transform: scale(1.06);
      box-shadow: 0 0 0 2px rgba(212, 167, 56, 0.4);
    }

    .lightbox-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 768px) {
      .lightbox-top-bar {
        padding: 10px 14px;
      }

      .lightbox-addr {
        display: none;
      }

      .lightbox-nav-btn {
        width: 44px;
        height: 44px;
      }

      .lightbox-nav-btn.prev {
        left: 8px;
      }

      .lightbox-nav-btn.next {
        right: 8px;
      }

      .lightbox-img {
        max-width: 98vw;
        max-height: 74vh;
      }

      .lightbox-thumb {
        width: 48px;
        height: 34px;
        flex: 0 0 48px;
      }

      .expand-badge span {
        display: none;
      }

      .expand-badge {
        padding: 7px;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        justify-content: center;
      }
    }

    .thumbs-strip {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: thin;
    }

    .thumbs-strip::-webkit-scrollbar {
      height: 6px;
    }

    .thumbs-strip::-webkit-scrollbar-thumb {
      background: var(--slate-300);
      border-radius: 3px;
    }

    .thumb-btn {
      flex: 0 0 auto;
      width: 100px;
      height: 66px;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      background: var(--slate-200);
      opacity: 0.55;
      transition: all 0.2s ease;
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-btn:hover {
      opacity: 0.9;
    }

    .thumb-btn.active {
      opacity: 1;
      border-color: var(--gold-500);
      box-shadow: 0 0 0 2px rgba(212, 167, 56, 0.35);
    }

    /* ─── Content Layout ─── */
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 36px;
      align-items: start;
    }

    .main-col {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Header Bar within Card */
    .prop-header-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }

    .top-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-active {
      background: var(--emerald-100);
      color: var(--emerald-600);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .status-closed {
      background: var(--slate-200);
      color: var(--slate-700);
    }

    .prop-price {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--navy-950);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .prop-address {
      font-size: 26px;
      font-weight: 800;
      color: var(--navy-900);
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .prop-location {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      color: var(--slate-500);
      font-weight: 500;
    }

    .prop-location svg {
      color: var(--gold-600);
    }

    /* Quick Specs Bar */
    .specs-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--slate-200);
    }

    .spec-box {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-sizing: border-box;
    }

    .spec-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: rgba(212, 167, 56, 0.12);
      color: var(--gold-600);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .spec-data {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .spec-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy-900);
      line-height: 1.25;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .spec-label {
      font-size: 11px;
      color: var(--slate-500);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 3px;
      white-space: nowrap;
    }

    /* Section Cards */
    .section-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }

    .section-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--gold-100);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 20px;
      background: var(--gold-500);
      border-radius: 2px;
      display: inline-block;
    }

    .remarks-text {
      color: var(--slate-700);
      font-size: 15.5px;
      line-height: 1.75;
      white-space: pre-line;
    }

    /* Detailed Table Grid */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 14px;
      background: var(--slate-50);
      border-radius: var(--radius-sm);
      border: 1px solid var(--slate-200);
      gap: 12px;
    }

    .detail-key {
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-500);
    }

    .detail-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy-900);
      text-align: right;
    }

    /* ─── Sticky Sidebar ─── */
    .sidebar {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
    }

  </style>
</head>

<body>
  <!-- Full-Width Hero Header -->
  <header class="hero">
    <div class="hero-wrap">
      <div class="hero-top-row">
        <a class="back-link-pill" href="ghlpage.html"
          onclick="if (history.length > 1) { history.back(); return false; }">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m15 18-6-6 6-6" />
          </svg>
          Back to Listings
        </a>
        <div class="hero-eyebrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z" />
          </svg>
          Keller Williams Tampa Properties
        </div>
      </div>
      <h1 class="hero-title">Paul Mercer, Real Estate Listings</h1>
      <div class="hero-subtitle">
        <span>The Mercer Group</span>
        <span class="dot"></span>
        <span>Tampa, FL</span>
        <span class="dot"></span>
        <span>Luxury & Residential Portfolio</span>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Skeleton loader placeholder -->
    <div id="skeleton-view">
      <div class="skeleton sk-gallery"></div>
      <div class="skeleton sk-line xl"></div>
      <div class="skeleton sk-line lg"></div>
      <div class="skeleton sk-line full"></div>
      <div class="skeleton sk-line full"></div>
    </div>

    <!-- Active Property View -->
    <main id="listing-view" style="display: none;"></main>

    <!-- Error View -->
    <div id="error-view" style="display: none;" class="error-box"></div>
  </div>

  <!-- Full-Screen Lightbox Modal for Photo Preview -->
  <div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true"
    aria-label="Photo gallery fullscreen preview">
    <div class="lightbox-top-bar">
      <div class="lightbox-info">
        <span class="lightbox-addr" id="lightbox-addr">Property Gallery</span>
        <span class="lightbox-counter-pill" id="lightbox-counter">1 / 1</span>
      </div>
      <button class="lightbox-close-btn" id="lightbox-close" aria-label="Close photo preview">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
    <div class="lightbox-main" id="lightbox-main">
      <button class="lightbox-nav-btn prev" id="lightbox-prev" aria-label="Previous photo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <div class="lightbox-stage" id="lightbox-stage">
        <img class="lightbox-img" id="lightbox-img" src="" alt="Property photo preview" draggable="false" />
      </div>
      <button class="lightbox-nav-btn next" id="lightbox-next" aria-label="Next photo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>
    <div class="lightbox-bottom-strip" id="lightbox-thumbs"></div>
  </div>

  <script>
    // Configuration & Dual API Failover
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:";
    const PRIMARY_API = isLocal ? "http://localhost:3000" : "https://gesticular-steamtight-svetlana.ngrok-free.dev";
    const SECONDARY_API = isLocal ? "https://gesticular-steamtight-svetlana.ngrok-free.dev" : "http://localhost:3000";

    const params = new URLSearchParams(window.location.search);
    let listingKey = params.get('listingKey');
    let isPreviewFallback = false;

    // If accessed directly without a listingKey, default to Paul Mercer's featured listing
    if (!listingKey) {
      listingKey = 'MFR802391689'; // Paul Mercer Premier Active Listing
      isPreviewFallback = true;
    }

    const svg = (p, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const ICON = {
      prev: svg('<path d="m15 18-6-6 6-6"/>', 22),
      next: svg('<path d="m9 18 6-6-6-6"/>', 22),
      close: svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 22),
      expand: svg('<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>', 15),
      bed: svg('<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M12 4v6"/><path d="M2 18h20"/>', 22),
      bath: svg('<path d="M9 6 6.5 3.5a1.5 1.5 0 0 0-1-.5C4.7 3 4 3.7 4 4.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M2 12h20"/><path d="M7 19v2"/><path d="M17 19v2"/>', 22),
      area: svg('<path d="M21 3H3v18h18z"/><path d="M3 9h6V3"/><path d="M21 15h-6v6"/>', 22),
      lot: svg('<path d="M3 21 12 3l9 18z"/><path d="M8 21l4-8 4 8"/>', 22),
      type: svg('<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>', 22),
      pin: svg('<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>', 18),
      phone: svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>', 18),
      mail: svg('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>', 18),
      video: svg('<path d="m22 8-6 4 6 4z"/><rect x="2" y="6" width="14" height="12" rx="2"/>', 18),
      image: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>', 32),
      camera: svg('<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>', 15),
      star: svg('<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>', 14),
      chevronLeft: svg('<path d="m15 18-6-6 6-6"/>', 15),
      chevronRight: svg('<path d="m9 18 6-6-6-6"/>', 15),
      building: svg('<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>', 16),
    };

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const cleanMlsId = (id) => String(id ?? '').replace(/^MFR/, '');
    const formatPrice = (p) => (p ? '$' + Number(p).toLocaleString('en-US') : 'Price unavailable');

    function formatMlsTimestamp(ts) {
      if (!ts) return "recently";
      try {
        const d = new Date(ts);
        const dateStr = d.toLocaleDateString("en-US", {
          month: "long",
          day: "numeric",
          year: "numeric",
          timeZone: "America/New_York",
        });
        const timeStr = d.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
          timeZone: "America/New_York",
        });
        return `${dateStr} at ${timeStr}`;
      } catch (_) {
        return String(ts);
      }
    }

    function statusClass(s) {
      const v = (s || '').toLowerCase();
      if (v === 'active') return 'status-active';
      if (v === 'pending') return 'status-pending';
      return 'status-closed';
    }

    function getMedia(raw) {
      const media = raw?.Media;
      if (!media?.length) return [];
      return [...media].sort((a, b) => (a.Order ?? 0) - (b.Order ?? 0)).filter((m) => m.MediaURL);
    }

    function detailItem(label, value) {
      if (value === null || value === undefined || value === '') return '';
      return `<div class="detail-item"><span class="detail-key">${label}</span><span class="detail-val">${esc(value)}</span></div>`;
    }

    function specBox(icon, value, label) {
      if (value === null || value === undefined || value === '') return '';
      return `
        <div class="spec-box">
          <div class="spec-icon">${icon}</div>
          <div class="spec-data">
            <span class="spec-value">${esc(value)}</span>
            <span class="spec-label">${label}</span>
          </div>
        </div>`;
    }

    /* ---------- Full-Screen Lightbox & Slider Controllers ---------- */
    let lightboxMedia = [];
    let currentLightboxIndex = 0;

    function openLightbox(idx = 0) {
      if (!lightboxMedia.length) return;
      currentLightboxIndex = Math.max(0, Math.min(lightboxMedia.length - 1, idx));
      const modal = document.getElementById('lightbox-modal');
      if (!modal) return;
      modal.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      updateLightboxView();
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      if (!modal) return;
      modal.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    function lightboxGo(i) {
      if (i < 0 || i >= lightboxMedia.length) return;
      currentLightboxIndex = i;
      updateLightboxView();
    }

    function updateLightboxView() {
      const item = lightboxMedia[currentLightboxIndex];
      if (!item) return;
      const img = document.getElementById('lightbox-img');
      const counter = document.getElementById('lightbox-counter');
      const prevBtn = document.getElementById('lightbox-prev');
      const nextBtn = document.getElementById('lightbox-next');

      if (img) {
        img.style.opacity = '0.35';
        img.src = item.MediaURL;
        img.onload = () => { img.style.opacity = '1'; };
      }

      if (counter) {
        counter.innerHTML = `${ICON.camera}<span>${currentLightboxIndex + 1} of ${lightboxMedia.length}</span>`;
      }

      if (prevBtn) prevBtn.disabled = currentLightboxIndex === 0;
      if (nextBtn) nextBtn.disabled = currentLightboxIndex === lightboxMedia.length - 1;

      const thumbs = document.querySelectorAll('.lightbox-thumb');
      thumbs.forEach((t, i) => {
        t.classList.toggle('active', i === currentLightboxIndex);
      });
      thumbs[currentLightboxIndex]?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }

    function initLightboxEvents() {
      const closeBtn = document.getElementById('lightbox-close');
      const prevBtn = document.getElementById('lightbox-prev');
      const nextBtn = document.getElementById('lightbox-next');
      const stage = document.getElementById('lightbox-stage');
      const main = document.getElementById('lightbox-main');

      if (closeBtn) closeBtn.onclick = closeLightbox;
      if (prevBtn) prevBtn.onclick = () => lightboxGo(currentLightboxIndex - 1);
      if (nextBtn) nextBtn.onclick = () => lightboxGo(currentLightboxIndex + 1);

      // Click outside image closes lightbox
      if (main) {
        main.addEventListener('click', (e) => {
          if (e.target === main || e.target === stage) {
            closeLightbox();
          }
        });
      }

      // Touch / Swipe Navigation for Mobile
      let touchStartX = 0, touchStartY = 0, touchDx = 0, touchDy = 0;
      if (stage) {
        stage.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchDx = 0;
          touchDy = 0;
        }, { passive: true });

        stage.addEventListener('touchmove', (e) => {
          if (e.touches.length !== 1) return;
          touchDx = e.touches[0].clientX - touchStartX;
          touchDy = e.touches[0].clientY - touchStartY;
        }, { passive: true });

        stage.addEventListener('touchend', () => {
          // Swipe down to dismiss
          if (touchDy > 80 && Math.abs(touchDy) > Math.abs(touchDx) * 1.4) {
            closeLightbox();
            return;
          }
          // Horizontal swipe
          if (touchDx < -45) {
            lightboxGo(currentLightboxIndex + 1);
          } else if (touchDx > 45) {
            lightboxGo(currentLightboxIndex - 1);
          }
        });
      }

      // Global keyboard navigation
      window.addEventListener('keydown', (e) => {
        const modal = document.getElementById('lightbox-modal');
        if (!modal || !modal.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') lightboxGo(currentLightboxIndex - 1);
        if (e.key === 'ArrowRight') lightboxGo(currentLightboxIndex + 1);
      });
    }

    /* ---------- Main In-Page Slider Controller ---------- */
    function initSlider(count) {
      if (!count) return;
      const track = document.getElementById('track');
      const viewport = document.getElementById('viewport');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const counter = document.getElementById('counter-num');
      const thumbs = [...document.querySelectorAll('.thumb-btn')];
      const expandBtn = document.getElementById('btn-open-lightbox');
      let index = 0, startX = 0, dx = 0, dragging = false;

      function go(i) {
        index = Math.max(0, Math.min(count - 1, i));
        track.style.transform = `translateX(${-index * 100}%)`;
        if (counter) counter.textContent = `${index + 1} / ${count}`;
        if (prev) prev.disabled = index === 0;
        if (next) next.disabled = index === count - 1;
        thumbs.forEach((t, n) => {
          t.classList.toggle('active', n === index);
          t.setAttribute('aria-current', n === index ? 'true' : 'false');
        });
        thumbs[index]?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }

      if (prev) prev.onclick = () => go(index - 1);
      if (next) next.onclick = () => go(index + 1);
      thumbs.forEach((t, n) => (t.onclick = () => go(n)));

      if (expandBtn) {
        expandBtn.onclick = (e) => {
          e.stopPropagation();
          openLightbox(index);
        };
      }

      viewport.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') go(index - 1);
        if (e.key === 'ArrowRight') go(index + 1);
      });

      viewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.nav-btn') || e.target.closest('.expand-badge')) return;
        dragging = true; startX = e.clientX; dx = 0;
        track.classList.add('dragging');
        viewport.setPointerCapture(e.pointerId);
      });

      viewport.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        dx = e.clientX - startX;
        track.style.transform = `translateX(calc(${-index * 100}% + ${dx}px))`;
      });

      const end = () => {
        if (!dragging) return;
        dragging = false;
        track.classList.remove('dragging');
        const threshold = viewport.offsetWidth * 0.15;
        if (dx < -threshold) {
          go(index + 1);
        } else if (dx > threshold) {
          go(index - 1);
        } else {
          // If barely moved, user tapped/clicked on the photo -> open fullscreen preview!
          if (Math.abs(dx) < 8) {
            openLightbox(index);
          } else {
            go(index);
          }
        }
      };

      viewport.addEventListener('pointerup', end);
      viewport.addEventListener('pointercancel', end);

      go(0);
      initLightboxEvents();
    }

    function renderListing(l, feedSyncAt) {
      const raw = l.raw_data ?? {};
      const media = getMedia(raw);
      lightboxMedia = media;

      const isMercerListing = l.agent_mls_id === 'MFR261510833' || raw.ListAgentMlsId === 'MFR261510833';
      const modTs = raw.ModificationTimestamp || l.modification_timestamp;
      const formattedModTs = formatMlsTimestamp(modTs);
      const formattedFeedSync = formatMlsTimestamp(feedSyncAt || modTs);

      const street = `${raw.StreetNumber ?? ''} ${raw.StreetName ?? ''} ${raw.StreetSuffix ?? ''}`.trim();
      const cityLine = `${l.city ?? ''}${l.postal_code ? ', FL ' + l.postal_code : ''}`;

      // Update Lightbox Title
      const lbAddr = document.getElementById('lightbox-addr');
      if (lbAddr) lbAddr.textContent = street ? `${street}, ${cityLine}` : 'Property Photo Gallery';

      // Update Lightbox Bottom Thumbs
      const lbThumbs = document.getElementById('lightbox-thumbs');
      if (lbThumbs) {
        lbThumbs.innerHTML = media.map((m, i) => `
          <button class="lightbox-thumb" onclick="lightboxGo(${i})" aria-label="Jump to photo ${i + 1}">
            <img src="${esc(m.MediaURL)}" alt="" loading="lazy" />
          </button>
        `).join('');
      }

      const galleryHtml = media.length ? `
        <div class="slider-wrap">
          <div class="slider" id="viewport" tabindex="0" role="region" aria-label="Property photos - click to enlarge">
            <div class="track" id="track">
              ${media.map((m, i) => `
                <div class="slide" data-index="${i}">
                  <img src="${esc(m.MediaURL)}" alt="Photo ${i + 1} of ${media.length}" ${i > 1 ? 'loading="lazy"' : ''} draggable="false" />
                </div>`).join('')}
            </div>
            ${media.length > 1 ? `
            <button class="nav-btn prev" id="prev" aria-label="Previous photo">${ICON.prev}</button>
            <button class="nav-btn next" id="next" aria-label="Next photo">${ICON.next}</button>` : ''}
            <button class="expand-badge" id="btn-open-lightbox" type="button" aria-label="Open full screen photos">
              ${ICON.expand}<span>Tap for Fullscreen</span>
            </button>
            <div class="counter-badge">${ICON.camera}<span id="counter-num">1 / ${media.length}</span></div>
          </div>
          ${media.length > 1 ? `
          <div class="thumbs-strip">
            ${media.map((m, i) => `<button class="thumb-btn" aria-label="Photo ${i + 1}"><img src="${esc(m.MediaURL)}" alt="" loading="lazy" /></button>`).join('')}
          </div>` : ''}
        </div>` : `
        <div class="slider-wrap">
          <div class="slider" style="display:flex;align-items:center;justify-content:center;color:var(--slate-400);flex-direction:column;gap:8px;">
            ${ICON.image}
            <span>No property photos available</span>
          </div>
        </div>`;

      const previewNotice = isPreviewFallback ? `
        <div class="preview-banner">
          <div><strong>Featured Property Preview:</strong> Showing Paul Mercer's premier active listing.</div>
          <a href="ghlpage.html" style="color:#1d4ed8;font-weight:700;text-decoration:underline;display:inline-flex;align-items:center;gap:4px;">Browse All Properties ${ICON.chevronRight}</a>
        </div>` : '';

      document.getElementById('listing-view').innerHTML = `
        ${previewNotice}
        ${galleryHtml}

        <div class="content-grid">
          <!-- Main Details -->
          <div class="main-col">
            <div class="prop-header-card">
              <div class="top-meta-row">
                <span class="status-badge ${statusClass(l.standard_status)}">${esc(l.standard_status ?? 'Active')}</span>
                <span class="prop-price">${formatPrice(l.list_price)}</span>
              </div>

              <h1 class="prop-address">${esc(street) || 'Address Upon Request'}</h1>
              <div class="prop-location">
                ${ICON.pin}
                <span>${esc(cityLine)}</span>
              </div>

              <!-- Mandatory Broker Attribution -->
              <div class="broker-attribution-box">
                <div class="attribution-main">
                  ${ICON.building}
                  <span><strong>Listing Courtesy of:</strong> ${esc(raw.ListOfficeName || 'Keller Williams Tampa Properties')}</span>
                </div>
                <div class="attribution-sub">
                  <span>MLS ID: <strong>#${esc(cleanMlsId(raw.ListingId || l.listing_key))}</strong></span>
                  <span>·</span>
                  <span>Stellar MLS / MLS Grid</span>
                  <span>·</span>
                  <span>Last Updated: <strong>${esc(formattedModTs)}</strong></span>
                </div>
              </div>

              <div class="specs-bar">
                ${specBox(ICON.bed, l.bedrooms_total, 'Beds')}
                ${specBox(ICON.bath, l.bathrooms_total, 'Baths')}
                ${specBox(ICON.area, l.living_area ? Number(l.living_area).toLocaleString() + ' sq ft' : null, 'Living Area')}
                ${specBox(ICON.lot, raw.LotSizeAcres ? raw.LotSizeAcres + ' ac' : null, 'Lot Size')}
                ${specBox(ICON.type, l.property_type, 'Property Type')}
              </div>
            </div>

            ${raw.PublicRemarks ? `
            <div class="section-card">
              <h2 class="section-title">About This Property</h2>
              <p class="remarks-text">${esc(raw.PublicRemarks)}</p>
            </div>` : ''}

            <div class="section-card">
              <h2 class="section-title">Property Details & Specifications</h2>
              <div class="details-grid">
                ${detailItem('MLS ID', cleanMlsId(raw.ListingId || l.listing_key))}
                ${detailItem('Standard Status', l.standard_status)}
                ${detailItem('Property Type', l.property_type)}
                ${detailItem('Property Sub-Type', raw.PropertySubType)}
                ${detailItem('County', raw.CountyOrParish)}
                ${detailItem('Subdivision', raw.SubdivisionName)}
                ${detailItem('Year Built', raw.YearBuilt)}
                ${detailItem('Living Area', l.living_area ? Number(l.living_area).toLocaleString() + ' sq ft' : null)}
                ${detailItem('Lot Size (Sq Ft)', raw.LotSizeSquareFeet?.toLocaleString())}
                ${detailItem('Lot Size (Acres)', raw.LotSizeAcres)}
                ${detailItem('Days on Market', raw.DaysOnMarket)}
                ${detailItem('HOA Fee', raw.AssociationFee ? '$' + raw.AssociationFee + ' / yr' : 'None')}
                ${detailItem('Annual Taxes', raw.TaxAnnualAmount ? '$' + raw.TaxAnnualAmount : null)}
                ${detailItem('Tax Year', raw.TaxYear)}
                ${detailItem('Parcel ID', raw.ParcelNumber)}
                ${detailItem('Listed On', raw.OnMarketDate)}
                ${detailItem('Last Modified', formattedModTs)}
              </div>
            </div>
          </div>

          <!-- Sticky Sidebar -->
          <aside class="sidebar">
            <div class="sidebar-card agent-box">
              <div class="agent-header">Presented By</div>
              <div class="agent-name">${esc(raw.ListAgentFullName ?? 'Paul Mercer')}</div>
              <div class="agent-office">${esc(raw.ListOfficeName ?? 'Keller Williams Tampa Properties')}</div>

              ${isMercerListing ? `
              <div class="mercer-exclusive-badge">
                ${ICON.star}
                <span>Paul Mercer Exclusive Listing</span>
              </div>` : ''}

              <div class="btn-group">
                ${raw.ListAgentDirectPhone ? `
                <a class="btn btn-gold" href="tel:${esc(raw.ListAgentDirectPhone)}">
                  ${ICON.phone}
                  <span>${esc(raw.ListAgentDirectPhone)}</span>
                </a>` : ''}

                ${raw.ListAgentEmail ? `
                <a class="btn btn-primary" href="mailto:${esc(raw.ListAgentEmail)}?subject=Inquiry regarding ${encodeURIComponent(street)}">
                  ${ICON.mail}
                  <span>Email Listing Agent</span>
                </a>` : ''}

                ${raw.VirtualTourURLUnbranded ? `
                <a class="btn btn-outline" href="${esc(raw.VirtualTourURLUnbranded)}" target="_blank" rel="noopener">
                  ${ICON.video}
                  <span>Virtual Tour Experience</span>
                </a>` : ''}

                <a class="btn btn-outline" href="ghlpage.html" onclick="if (history.length > 1) { history.back(); return false; }">
                  ${ICON.chevronLeft}<span>Browse All Listings</span>
                </a>
              </div>
            </div>

            <div class="listing-key-card">
              <span>Listing MLS Key</span>
              <code>${esc(l.listing_key)}</code>
            </div>
          </aside>
        </div>

        <!-- Official Stellar MLS / MLS Grid IDX Compliance Footer -->
        <footer class="mls-compliance-footer">
          <div class="compliance-badge">
            <span class="idx-badge">IDX</span>
            <strong>Stellar MLS · MLS GRID Compliance Notice</strong>
          </div>
          <p class="compliance-text">
            Based on information submitted to the MLS GRID as of ${esc(formattedFeedSync)} (updated every 15 minutes). All data is obtained from various sources and may not have been verified by broker or MLS GRID. Supplied information is subject to change without notice. All information should be independently reviewed and verified for accuracy. Properties may or may not be listed by the office/agent presenting the information.
          </p>
          <p class="compliance-text">
            IDX information is provided exclusively for consumers' personal, non-commercial use, and may not be used for any purpose other than to identify prospective properties consumers may be interested in purchasing.
          </p>
          <div class="compliance-copyright">
            <span>Information is deemed reliable but is not guaranteed.</span>
            <span>© ${new Date().getFullYear()} Stellar MLS / MLS GRID. All rights reserved.</span>
          </div>
        </footer>`;

      document.getElementById('skeleton-view').style.display = 'none';
      document.getElementById('listing-view').style.display = 'block';
      document.title = `${street ? street + ' | ' : ''}Paul Mercer Real Estate`;
      initSlider(media.length);
    }

    function showError(msg) {
      document.getElementById('skeleton-view').style.display = 'none';
      const el = document.getElementById('error-view');
      el.style.display = 'block';
      el.innerHTML = `
        <h3>Unable to Load Property Details</h3>
        <p style="margin-bottom: 20px;">${esc(msg)}</p>
        <a class="back-link-pill" style="display:inline-flex;color:var(--navy-900);background:var(--gold-500);" href="ghlpage.html">Return to Property Directory</a>
      `;
    }

    async function loadListing() {
      try {
        let res;
        try {
          res = await fetch(`${PRIMARY_API}/api/listing/${encodeURIComponent(listingKey)}`, {
            headers: { 'ngrok-skip-browser-warning': 'true' },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
        } catch (primErr) {
          console.warn("Primary API failed, attempting secondary API:", primErr.message);
          res = await fetch(`${SECONDARY_API}/api/listing/${encodeURIComponent(listingKey)}`, {
            headers: { 'ngrok-skip-browser-warning': 'true' },
          });
        }

        const data = await res.json();
        if (!data.success || !data.listing) throw new Error(data.message || 'Listing not found');
        renderListing(data.listing, data.feedLastSyncAt);
      } catch (err) {
        showError(err.message);
      }
    }

    loadListing();
  </script>
</body>

</html>
